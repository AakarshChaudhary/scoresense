{% extends 'base.html' %}
{% block content %}
    <h2>Performance Analysis</h2>

    <!-- show message if no data yet -->
    {% if not has_data %}
        <p class="empty-message">No student data available yet. Add some students first.</p>
    {% else %}
        <div class="graph-grid">
            <div class="graph-box">
                <h3>Subject Wise Average Marks</h3>
                <img src="{{ url_for('static', filename='graphs/subject_avg.png') }}">
            </div>

            <div class="graph-box">
                <h3>Topper Comparison</h3>
                <img src="{{ url_for('static', filename='graphs/toppers.png') }}">
            </div>

            <div class="graph-box">
                <h3>Pass / Fail Ratio</h3>
                <img src="{{ url_for('static', filename='graphs/pass_fail.png') }}">
            </div>

            <div class="graph-box">
                <h3>Student Wise Progress</h3>
                <img src="{{ url_for('static', filename='graphs/progress.png') }}">
            </div>
        </div>
    {% endif %}
{% endblock %}
