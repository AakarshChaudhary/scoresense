{% extends 'base.html' %}
{% block content %}
    <h2>Add Student Record</h2>
    <form method="POST">
        Name: <input type="text" name="name" required><br><br>
        Roll No: <input type="text" name="roll_no" required><br><br>
        Physics Marks: <input type="number" step="0.01" name="physics" required><br><br>
        Chemistry Marks: <input type="number" step="0.01" name="chemistry" required><br><br>
        Maths Marks: <input type="number" step="0.01" name="maths" required><br><br>
        <input type="submit" value="Add Student">
    </form>
{% endblock %}
